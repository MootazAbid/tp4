{% extends "catalogue/base.html" %}
{% block title %}Catégories{% endblock %}
{% block content %}
<h2>Catégories</h2>
<p><a class="btn" href="{% url 'catalogue:categorie_create' %}">Ajouter une catégorie</a></p>
<ul>
    {% for categorie in categories %}
    <li>{{ categorie.name }} — <a href="{% url 'catalogue:categorie_delete' categorie.pk %}">Supprimer</a></li>
    {% empty %}
    <li>Aucune catégorie.</li>
    {% endfor %}
</ul>
{% endblock %}
